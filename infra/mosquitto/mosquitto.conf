# Mosquitto 2.x - Smart Energy Manager
# Autenticacao por usuario/senha + ACL por topico. O HMAC dos comandos (docs/05 §7)
# e uma camada ADICIONAL: mesmo com credenciais do broker, um comando sem HMAC
# valido e rejeitado pelo firmware.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Rede local da bancada. Para acesso fora do laboratorio, use TLS (porta 8883)
# com certificados proprios: listener 8883 + cafile/certfile/keyfile.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Limites coerentes com o firmware (buffer MQTT do ESP32)
max_packet_size 8192
max_inflight_messages 20
max_queued_messages 200
