# Smart Energy Manager - infraestrutura de apoio (broker MQTT + TSDB opcional).
# NAO EXECUTADO no ambiente de desenvolvimento (sem Docker); sintaxe validada com yaml.safe_load.
#
# Uso:
#   cp .env.example .env            # e edite as senhas
#   ./mosquitto/make-passwd.sh      # gera mosquitto/passwd (nao versionado)
#   docker compose up -d                       # somente o broker Mosquitto
#   docker compose --profile tsdb up -d        # + InfluxDB 2 + Grafana (opcionais)
#
# O backend Python (ingest/serve/live-ems) roda no host com o venv; ver backend/README.md.

name: smart-energy-manager

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    environment:
      MQTT_HEALTH_USER: ${MQTT_HEALTH_USER:-sem-monitor}
      MQTT_HEALTH_PASSWORD: ${MQTT_HEALTH_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -u \"$${MQTT_HEALTH_USER}\" -P \"$${MQTT_HEALTH_PASSWORD}\" -t '$$SYS/broker/uptime' -C 1 -W 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  influxdb:
    image: influxdb:2
    profiles: ["tsdb"]
    restart: unless-stopped
    ports:
      - "${INFLUX_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:-sem-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?defina INFLUX_ADMIN_PASSWORD no .env}
      DOCKER_INFLUXDB_INIT_ORG: ${SEM_INFLUX_ORG:-utfpr-cp}
      DOCKER_INFLUXDB_INIT_BUCKET: ${SEM_INFLUX_BUCKET:-smartenergy}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION:-0}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${SEM_INFLUX_TOKEN:?defina SEM_INFLUX_TOKEN no .env}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

  grafana:
    image: grafana/grafana-oss:11.2.0
    profiles: ["tsdb"]
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb-data:
  influxdb-config:
  grafana-data:
