; =============================================================================
; Smart Energy Manager — firmware do ESP32 (PlatformIO)
;
;   pio run -e esp32dev                 compila para o ESP32 DevKit (core Arduino 2.0.x)
;   pio run -e esp32dev -t upload       grava (USB)
;   pio device monitor -e esp32dev      monitor serial (115200)
;   pio test -e native                  testes nativos da lógica pura (lib/sem_core)
;
; Parâmetros do sistema: NÃO edite aqui. Fonte única = config/system.yaml ->
;   python tools/gen_firmware_params.py  (gera include/system_params.h)
; Credenciais: include/secrets.h (copiar de include/secrets.h.example).
; =============================================================================
[platformio]
default_envs = esp32dev

[env:esp32dev]
; Plataforma fixada (6.9.0 => framework Arduino-ESP32 2.0.17 / ESP-IDF 4.4).
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Isrc
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

[env:native]
; Somente lib/sem_core + test/ (nada de src/, que depende de Arduino/ESP-IDF).
; O portão estrito (-Werror) é tools/run_native_tests.sh; aqui -std=gnu++17 também
; chega aos arquivos C do Unity (aviso inofensivo do GCC), por isso sem -Werror.
platform = native
test_framework = unity
test_build_src = no
build_src_filter = -<*>
lib_compat_mode = off
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Iinclude
    -DUNITY_INCLUDE_DOUBLE
    '-DSEM_VECTORS_DIR="test/vectors"'
