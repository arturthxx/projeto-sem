[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartenergy"
version = "0.1.0"
description = "Smart Energy Manager - backend, simulacao e EMS de uma microrrede FV de bancada (IC UTFPR-CP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "pulp>=2.8",
  "highspy>=1.7",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "paho-mqtt>=2.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
influx = ["influxdb-client>=1.40"]
dev = ["pytest>=8", "httpx>=0.27", "amqtt>=0.11", "schemdraw>=0.18"]

[project.scripts]
smartenergy = "smartenergy.cli:main"

[tool.setuptools.packages.find]
include = ["smartenergy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
